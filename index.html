<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheryl Paul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f0f0f;
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .tagline {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            color: #888;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border: 1px solid #333;
            border-radius: 6px;
            transition: color 0.2s, border-color 0.2s;
        }

        .links a:hover {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sheryl Paul</h1>
        <p class="tagline">Software Developer</p>
        <div class="links">
            <a href="https://github.com/sherylpaul">GitHub</a>
            <a href="https://linkedin.com/in/sherylpaul">LinkedIn</a>
            <a href="mailto:hello@example.com">Email</a>
        </div>
    </div>
</body>
</html>
